map $http_upgrade $sector_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name 8.153.150.101;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/sector-acme;
        default_type text/plain;
    }
    location / { return 308 https://8.153.150.101$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name 8.153.150.101;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/sector-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sector-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SECTOR:5m;
    ssl_session_timeout 1d;

    root /var/www/playroom/current;
    index index.html;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_static on;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /index.html { return 308 /; }
    location ^~ /lobby/ {
        try_files $uri =404;
        expires 1d;
    }
    location ^~ /tavern-api/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location = /tavern { return 308 /tavern/; }
    location ^~ /tavern/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /tavern/art/ {
        try_files $uri =404;
        expires 7d;
    }
    location ^~ /tavern/cards/ {
        try_files $uri =404;
        expires 7d;
    }
    location ^~ /tavern/thumbs/ {
        try_files $uri =404;
        expires 7d;
    }
    location ^~ /tavern/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location = /sector { return 308 /sector/; }
    location ^~ /sector/ {
        proxy_pass http://127.0.0.1:5173/;
        include /etc/nginx/snippets/playroom-sector-proxy.conf;
    }
    # Preserve SECTOR's existing /assets/, /ws and /api/ clients.
    location / {
        proxy_pass http://127.0.0.1:5173;
        include /etc/nginx/snippets/playroom-sector-proxy.conf;
    }
}
